name: Infracost

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
  pull_request:
    paths:
      - "infra/**"

jobs:
  # ===========================================================================
  # Cost breakdown: always runs, outputs summary to workflow log
  # ===========================================================================
  cost-breakdown:
    name: Cost Breakdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Infracost
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Generate cost breakdown
        run: |
          infracost breakdown \
            --path infra \
            --format json \
            --out-file /tmp/infracost-current.json

      - name: Print cost summary
        run: |
          infracost output \
            --path /tmp/infracost-current.json \
            --format table

      - name: Upload cost report
        uses: actions/upload-artifact@v4
        with:
          name: infracost-report
          path: /tmp/infracost-current.json
          retention-days: 30

  # ===========================================================================
  # Cost diff: PR only, compares branch against main baseline
  # ===========================================================================
  cost-diff:
    name: Cost Diff vs Main
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Infracost
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      # Baseline: cost of infra on main branch
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-branch

      - name: Generate baseline cost
        run: |
          infracost breakdown \
            --path main-branch/infra \
            --format json \
            --out-file /tmp/infracost-base.json

      # Current: cost of infra on PR branch
      - name: Generate current cost
        run: |
          infracost breakdown \
            --path infra \
            --format json \
            --out-file /tmp/infracost-current.json

      # Diff: show what changed
      - name: Generate cost diff
        run: |
          infracost diff \
            --path /tmp/infracost-current.json \
            --compare-to /tmp/infracost-base.json \
            --format json \
            --out-file /tmp/infracost-diff.json

      - name: Print cost diff
        run: |
          infracost output \
            --path /tmp/infracost-diff.json \
            --format table

      - name: Post PR comment
        run: |
          infracost comment github \
            --path /tmp/infracost-diff.json \
            --repo $GITHUB_REPOSITORY \
            --pull-request ${{ github.event.pull_request.number }} \
            --github-token ${{ secrets.GITHUB_TOKEN }} \
            --behavior update
