name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dotnet-build:
    name: Build Orders API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore src/OrdersApi/OrdersApi.csproj

      - name: Build
        run: dotnet build src/OrdersApi/OrdersApi.csproj --no-restore --configuration Release

  dbt-compile:
    name: Validate dbt Project
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dbt
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dbt
        run: pip install dbt-core==1.10.13 dbt-postgres==1.9.0

      - name: dbt deps
        run: dbt deps

      - name: dbt parse
        run: dbt parse --profiles-dir . --target dev

  docker-lint:
    name: Validate Docker Assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose config --quiet

      - name: Lint Orders API Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: src/OrdersApi/Dockerfile
          failure-threshold: warning

      - name: Lint Airflow Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: airflow/Dockerfile
          failure-threshold: warning
