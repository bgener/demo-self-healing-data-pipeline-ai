name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ===========================================================================
  # .NET: build and test the Orders API
  # ===========================================================================
  dotnet-build:
    name: Build .NET API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore src/OrdersApi/OrdersApi.csproj

      - name: Build
        run: dotnet build src/OrdersApi/OrdersApi.csproj --no-restore --configuration Release

  # ===========================================================================
  # Terraform: fmt, validate, lint, security scan
  # ===========================================================================
  terraform-quality:
    name: Terraform Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9"

      - name: Format check
        run: terraform fmt -check -recursive -diff

      - name: Init (backend only)
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate

      - name: Setup tflint
        uses: terraform-linters/setup-tflint@v4

      - name: Init tflint
        run: tflint --init

      - name: Run tflint
        run: tflint --format compact

      - name: Run Checkov (security scan)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra
          framework: terraform
          quiet: true
          soft_fail: true

  # ===========================================================================
  # dbt: compile and validate models
  # ===========================================================================
  dbt-compile:
    name: Validate dbt Models
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dbt
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dbt
        run: pip install dbt-core dbt-clickhouse

      - name: Install dbt packages
        run: dbt deps

      - name: Compile (syntax + ref validation)
        run: dbt compile --profiles-dir . --target dev
        env:
          CLICKHOUSE_HOST: localhost
          CLICKHOUSE_PORT: "8123"
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: dummy

  # ===========================================================================
  # Docker: validate compose config and Dockerfiles
  # ===========================================================================
  docker-lint:
    name: Docker Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Lint Dockerfiles
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: src/OrdersApi/Dockerfile
          failure-threshold: warning

      - name: Lint Dagster Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: dagster/Dockerfile
          failure-threshold: warning
