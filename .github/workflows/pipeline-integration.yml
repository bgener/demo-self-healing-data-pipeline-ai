name: Pipeline Integration Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pipeline-test:
    name: End-to-End Pipeline Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      timescaledb:
        image: timescale/timescaledb:2.19.3-pg16
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: warehouse
          POSTGRES_USER: pipeline
          POSTGRES_PASSWORD: pipeline
        options: >-
          --health-cmd "pg_isready -U pipeline -d warehouse"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client

      - name: Install Python dependencies
        run: pip install dbt-core==1.10.13 dbt-postgres==1.9.0 pymongo==4.13.2 psycopg2-binary==2.9.10

      # ---- Runtime lane: init + ingest ----

      - name: Initialize TimescaleDB
        id: init_db
        run: |
          $env:PGPASSWORD="pipeline"
          psql -h localhost -U pipeline -d warehouse -f scripts/init-timescaledb.sql
        shell: pwsh

      - name: Start Orders API and seed MongoDB
        id: orders_api
        run: |
          cd src/OrdersApi
          nohup dotnet run > ../../orders-api.log 2>&1 &
          echo "api_pid=$!" >> "$GITHUB_OUTPUT"
          sleep 15
        env:
          DocumentDb__ConnectionString: mongodb://localhost:27017
          DocumentDb__DatabaseName: ecommerce
          ASPNETCORE_URLS: http://+:5100

      - name: Verify seed data
        run: |
          curl -sf http://localhost:5100/api/orders?limit=2
          curl -sf http://localhost:5100/api/customers?limit=2

      - name: Ingest MongoDB into TimescaleDB raw layer
        id: ingest
        run: python scripts/ingest_mongo_to_timescale.py
        env:
          MONGO_CONNECTION_STRING: mongodb://localhost:27017
          MONGO_DATABASE: ecommerce
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: pipeline
          PGPASSWORD: pipeline
          PGDATABASE: warehouse

      # ---- Runtime failure evidence ----

      - name: Collect runtime failure evidence
        if: failure() && (steps.init_db.outcome == 'failure' || steps.ingest.outcome == 'failure')
        run: python scripts/collect_runtime_failure_evidence.py
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: pipeline
          PGPASSWORD: pipeline
          PGDATABASE: warehouse
          MONGO_CONNECTION_STRING: mongodb://localhost:27017
          MONGO_DATABASE: ecommerce

      - name: Upload runtime failure bundle
        if: failure() && (steps.init_db.outcome == 'failure' || steps.ingest.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: runtime-failure-pack
          path: artifacts/runtime-failure-pack
          if-no-files-found: warn

      # ---- dbt lane: freshness + build ----

      - name: dbt deps
        working-directory: dbt
        run: dbt deps

      - name: dbt source freshness
        working-directory: dbt
        run: dbt source freshness --profiles-dir . --target dev
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: pipeline
          PGPASSWORD: pipeline
          PGDATABASE: warehouse

      - name: dbt build
        id: dbt_build
        working-directory: dbt
        run: dbt build --profiles-dir . --target dev
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: pipeline
          PGPASSWORD: pipeline
          PGDATABASE: warehouse

      # ---- dbt failure evidence ----

      - name: Collect dbt failure evidence
        if: failure() && steps.dbt_build.outcome == 'failure'
        run: python scripts/collect_failure_evidence.py

      - name: Upload dbt failure bundle
        if: failure() && steps.dbt_build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: dbt-failure-pack
          path: artifacts/dbt-failure-pack
          if-no-files-found: error

      # ---- Validation ----

      - name: Validate marts
        if: success()
        run: |
          $env:PGPASSWORD="pipeline"
          psql -h localhost -U pipeline -d warehouse -c "select count(*) as order_lines from marts.fct_order_lines;"
          psql -h localhost -U pipeline -d warehouse -c "select count(*) as customers, round(sum(lifetime_value_usd), 2) as total_ltv from marts.dim_customers;"
          psql -h localhost -U pipeline -d warehouse -c "select count(*) as revenue_rows, round(sum(revenue_usd), 2) as total_revenue_usd from marts.fct_daily_revenue;"
        shell: pwsh

      - name: Stop Orders API
        if: always()
        run: |
          kill ${{ steps.orders_api.outputs.api_pid }} || true
