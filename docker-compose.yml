services:
  mongo:
    image: mongo:7
    container_name: shdp-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - pipeline

  timescaledb:
    image: timescale/timescaledb:2.19.3-pg16
    container_name: shdp-timescaledb
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: warehouse
      POSTGRES_USER: pipeline
      POSTGRES_PASSWORD: pipeline
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
      - ./scripts/init-timescaledb.sql:/docker-entrypoint-initdb.d/001-init-timescaledb.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipeline -d warehouse"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - pipeline

  orders-api:
    build:
      context: ./src/OrdersApi
      dockerfile: Dockerfile
    container_name: shdp-orders-api
    ports:
      - "5100:8080"
    environment:
      DocumentDb__ConnectionString: "mongodb://mongo:27017"
      DocumentDb__DatabaseName: "ecommerce"
      ASPNETCORE_ENVIRONMENT: "Development"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - pipeline

  airflow-db:
    image: postgres:16
    container_name: shdp-airflow-db
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - pipeline

  airflow-init:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    container_name: shdp-airflow-init
    depends_on:
      airflow-db:
        condition: service_healthy
      mongo:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
      PGHOST: timescaledb
      PGPORT: 5432
      PGUSER: pipeline
      PGPASSWORD: pipeline
      PGDATABASE: warehouse
      MONGO_CONNECTION_STRING: "mongodb://mongo:27017"
      MONGO_DATABASE: ecommerce
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./dbt:/opt/airflow/dbt
      - ./scripts:/opt/airflow/scripts
      - ./artifacts:/opt/airflow/artifacts
    command: >
      bash -lc "airflow db migrate &&
      airflow users create
      --username admin
      --firstname Admin
      --lastname User
      --role Admin
      --email admin@example.com
      --password admin || true"
    networks:
      - pipeline

  airflow-webserver:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    container_name: shdp-airflow-webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
      PGHOST: timescaledb
      PGPORT: 5432
      PGUSER: pipeline
      PGPASSWORD: pipeline
      PGDATABASE: warehouse
      MONGO_CONNECTION_STRING: "mongodb://mongo:27017"
      MONGO_DATABASE: ecommerce
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./dbt:/opt/airflow/dbt
      - ./scripts:/opt/airflow/scripts
      - ./artifacts:/opt/airflow/artifacts
    command: webserver
    ports:
      - "8080:8080"
    networks:
      - pipeline

  airflow-scheduler:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    container_name: shdp-airflow-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
      PGHOST: timescaledb
      PGPORT: 5432
      PGUSER: pipeline
      PGPASSWORD: pipeline
      PGDATABASE: warehouse
      MONGO_CONNECTION_STRING: "mongodb://mongo:27017"
      MONGO_DATABASE: ecommerce
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./dbt:/opt/airflow/dbt
      - ./scripts:/opt/airflow/scripts
      - ./artifacts:/opt/airflow/artifacts
    command: scheduler
    networks:
      - pipeline

volumes:
  mongo-data:
  timescaledb-data:
  airflow-db-data:

networks:
  pipeline:
    driver: bridge
