version: 2

models:
  - name: fct_order_lines
    columns:
      - name: order_id
        tests: [not_null]
      - name: sku
        tests: [not_null]
      - name: line_total_usd
        tests: [not_null]
  - name: fct_daily_revenue
    columns:
      - name: revenue_date
        tests: [not_null]
      - name: revenue_usd
        tests: [not_null]
  - name: dim_customers
    columns:
      - name: customer_id
        tests: [not_null, unique]
      - name: lifetime_value_usd
        tests: [not_null]
