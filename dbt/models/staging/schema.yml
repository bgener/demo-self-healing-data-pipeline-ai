version: 2

models:
  - name: stg_orders
    description: Cleaned orders with parsed shipping info
    columns:
      - name: order_id
        tests:
          - not_null
      - name: order_status
        tests:
          - not_null

  - name: stg_order_items
    description: Flattened order items (one row per line item)
    columns:
      - name: order_id
        tests:
          - not_null
      - name: sku
        tests:
          - not_null

  - name: stg_customers
    description: Cleaned customer documents
    columns:
      - name: customer_id
        tests:
          - not_null

  - name: stg_crypto_prices
    description: CoinGecko crypto price snapshots
    columns:
      - name: currency
        tests:
          - not_null
      - name: price_usd
        tests:
          - not_null
