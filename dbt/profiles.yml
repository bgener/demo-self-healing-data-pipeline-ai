elt_self_healing:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('PGHOST', 'localhost') }}"
      port: "{{ env_var('PGPORT', '5432') | int }}"
      user: "{{ env_var('PGUSER', 'pipeline') }}"
      password: "{{ env_var('PGPASSWORD', 'pipeline') }}"
      dbname: "{{ env_var('PGDATABASE', 'warehouse') }}"
      schema: marts
      threads: 4
