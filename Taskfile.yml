version: "3"

vars:
  PGHOST: localhost
  PGPORT: 5432
  PGUSER: pipeline
  PGPASSWORD: pipeline
  PGDATABASE: warehouse

tasks:
  up:
    desc: Start MongoDB, TimescaleDB, Orders API, and Airflow
    cmds:
      - docker compose up -d

  down:
    desc: Stop all services
    cmds:
      - docker compose down

  down-clean:
    desc: Stop all services and remove volumes
    cmds:
      - docker compose down -v

  db-init:
    desc: Initialize TimescaleDB schemas and raw tables
    cmds:
      - psql -h {{.PGHOST}} -p {{.PGPORT}} -U {{.PGUSER}} -d {{.PGDATABASE}} -f scripts/init-timescaledb.sql
    env:
      PGPASSWORD: "{{.PGPASSWORD}}"

  seed-check:
    desc: Verify MongoDB seed data
    cmds:
      - curl -sf http://localhost:5100/api/orders?limit=2
      - curl -sf http://localhost:5100/api/customers?limit=2

  ingest:
    desc: Load MongoDB documents into TimescaleDB raw schema
    cmds:
      - python scripts/ingest_mongo_to_timescale.py
    env:
      MONGO_CONNECTION_STRING: mongodb://localhost:27017
      MONGO_DATABASE: ecommerce
      PGHOST: "{{.PGHOST}}"
      PGPORT: "{{.PGPORT}}"
      PGUSER: "{{.PGUSER}}"
      PGPASSWORD: "{{.PGPASSWORD}}"
      PGDATABASE: "{{.PGDATABASE}}"

  dbt-deps:
    desc: Install dbt packages
    dir: dbt
    cmds:
      - dbt deps

  dbt-build:
    desc: Run dbt models and tests
    dir: dbt
    cmds:
      - dbt build --profiles-dir . --target dev
    env:
      PGHOST: "{{.PGHOST}}"
      PGPORT: "{{.PGPORT}}"
      PGUSER: "{{.PGUSER}}"
      PGPASSWORD: "{{.PGPASSWORD}}"
      PGDATABASE: "{{.PGDATABASE}}"

  dbt-freshness:
    desc: Run dbt source freshness checks
    dir: dbt
    cmds:
      - dbt source freshness --profiles-dir . --target dev
    env:
      PGHOST: "{{.PGHOST}}"
      PGPORT: "{{.PGPORT}}"
      PGUSER: "{{.PGUSER}}"
      PGPASSWORD: "{{.PGPASSWORD}}"
      PGDATABASE: "{{.PGDATABASE}}"

  collect-dbt-evidence:
    desc: Package dbt failure artifacts for AI triage
    cmds:
      - python scripts/collect_failure_evidence.py

  collect-runtime-evidence:
    desc: Package Airflow runtime failure evidence for AI triage
    cmds:
      - python scripts/collect_runtime_failure_evidence.py
    env:
      PGHOST: "{{.PGHOST}}"
      PGPORT: "{{.PGPORT}}"
      PGUSER: "{{.PGUSER}}"
      PGPASSWORD: "{{.PGPASSWORD}}"
      PGDATABASE: "{{.PGDATABASE}}"
      MONGO_CONNECTION_STRING: mongodb://localhost:27017
      MONGO_DATABASE: ecommerce

  collect-infra-evidence:
    desc: Package Terraform failure evidence for AI triage
    cmds:
      - python scripts/collect_infra_failure_evidence.py

  infra-init:
    desc: Initialize Terraform for TimescaleDB management
    dir: infra
    cmds:
      - terraform init

  infra-plan:
    desc: Run Terraform plan against local TimescaleDB
    dir: infra
    cmds:
      - terraform plan

  infra-apply:
    desc: Apply Terraform to local TimescaleDB
    dir: infra
    cmds:
      - terraform apply -auto-approve

  validate:
    desc: Query marts in TimescaleDB
    cmds:
      - psql -h {{.PGHOST}} -p {{.PGPORT}} -U {{.PGUSER}} -d {{.PGDATABASE}} -c "select count(*) as order_lines from marts.fct_order_lines;"
      - psql -h {{.PGHOST}} -p {{.PGPORT}} -U {{.PGUSER}} -d {{.PGDATABASE}} -c "select count(*) as customers, round(sum(lifetime_value_usd), 2) as total_ltv from marts.dim_customers;"
      - psql -h {{.PGHOST}} -p {{.PGPORT}} -U {{.PGUSER}} -d {{.PGDATABASE}} -c "select count(*) as revenue_rows, round(sum(revenue_usd), 2) as total_revenue_usd from marts.fct_daily_revenue;"
    env:
      PGPASSWORD: "{{.PGPASSWORD}}"

  test-pipeline:
    desc: Run the minimal local pipeline end to end
    cmds:
      - task: up
      - task: db-init
      - task: seed-check
      - task: ingest
      - task: dbt-deps
      - task: dbt-freshness
      - task: dbt-build
      - task: validate

  lint:
    desc: Validate compose and Dockerfiles
    cmds:
      - docker compose config --quiet

  setup:
    desc: First-time setup for the self-healing pipeline demo
    cmds:
      - task: test-pipeline
