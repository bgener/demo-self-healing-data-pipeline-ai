# https://taskfile.dev
version: "3"

vars:
  CLICKHOUSE_PASSWORD: clickhouse

tasks:
  # ===========================================================================
  # Infrastructure
  # ===========================================================================
  up:
    desc: Start all services
    cmds:
      - docker compose up -d
      - task: wait-healthy

  down:
    desc: Stop all services
    cmds:
      - docker compose down

  down-clean:
    desc: Stop all services and remove volumes
    cmds:
      - docker compose down -v

  wait-healthy:
    desc: Wait for services to be healthy
    cmds:
      - echo "Waiting for services..."
      - docker compose ps --format json | jq -r '.[].State' | sort | uniq -c
    silent: true

  # ===========================================================================
  # Seed and Init
  # ===========================================================================
  init-clickhouse:
    desc: Create ClickHouse databases
    cmds:
      - docker exec -i clickhouse clickhouse-client --password {{.CLICKHOUSE_PASSWORD}} < scripts/init-clickhouse.sql

  seed-check:
    desc: Verify DocumentDB was seeded by the Orders API
    cmds:
      - curl -sf http://localhost:5100/api/orders?limit=3 | jq
      - curl -sf http://localhost:5100/api/customers?limit=3 | jq
      - curl -sf http://localhost:5100/api/orders/revenue/daily?days=30 | jq '.[0:3]'

  # ===========================================================================
  # Terraform (Airbyte config)
  # ===========================================================================
  tf-init:
    desc: Initialize Terraform
    dir: infra
    cmds:
      - terraform init

  tf-plan:
    desc: Plan Airbyte configuration changes
    dir: infra
    cmds:
      - terraform plan

  tf-apply:
    desc: Apply Airbyte configuration
    dir: infra
    cmds:
      - terraform apply -auto-approve

  tf-lint:
    desc: Lint Terraform files
    dir: infra
    cmds:
      - terraform fmt -check -recursive -diff
      - terraform validate
      - tflint --init
      - tflint --format compact

  # ===========================================================================
  # dbt
  # ===========================================================================
  dbt-deps:
    desc: Install dbt packages
    dir: dbt
    cmds:
      - dbt deps

  dbt-build:
    desc: Run dbt models and tests
    dir: dbt
    cmds:
      - dbt build --profiles-dir .

  dbt-test:
    desc: Run dbt tests only
    dir: dbt
    cmds:
      - dbt test --profiles-dir .

  dbt-docs:
    desc: Generate and serve dbt documentation
    dir: dbt
    cmds:
      - dbt docs generate --profiles-dir .
      - dbt docs serve --profiles-dir .

  # ===========================================================================
  # Pipeline test (local, simulates CI)
  # ===========================================================================
  test-pipeline:
    desc: Run the full pipeline integration test locally
    cmds:
      - task: up
      - task: init-clickhouse
      - echo "Loading test data into ClickHouse raw tables..."
      - docker exec -i clickhouse clickhouse-client --password {{.CLICKHOUSE_PASSWORD}} --queries-file /dev/stdin < scripts/testdata/create-raw-tables.sql
      - docker exec -i clickhouse clickhouse-client --password {{.CLICKHOUSE_PASSWORD}} --queries-file /dev/stdin < scripts/testdata/seed-raw-orders.sql
      - docker exec -i clickhouse clickhouse-client --password {{.CLICKHOUSE_PASSWORD}} --queries-file /dev/stdin < scripts/testdata/seed-raw-customers.sql
      - docker exec -i clickhouse clickhouse-client --password {{.CLICKHOUSE_PASSWORD}} --queries-file /dev/stdin < scripts/testdata/seed-raw-crypto-prices.sql
      - task: dbt-deps
      - task: dbt-build
      - task: validate

  validate:
    desc: Validate analytical output in ClickHouse
    cmds:
      - echo "=== fct_order_lines ==="
      - docker exec clickhouse clickhouse-client --password {{.CLICKHOUSE_PASSWORD}} --query "SELECT count() as rows, round(sum(line_total_usd), 2) as total_usd FROM analytics.fct_order_lines WHERE order_status = 'completed'"
      - echo "=== dim_customers ==="
      - docker exec clickhouse clickhouse-client --password {{.CLICKHOUSE_PASSWORD}} --query "SELECT count() as customers, round(sum(lifetime_value_usd), 2) as total_ltv FROM analytics.dim_customers"
      - echo "=== Crypto enrichment ==="
      - docker exec clickhouse clickhouse-client --password {{.CLICKHOUSE_PASSWORD}} --query "SELECT currency, count() as lines, round(avg(line_total_usd), 2) as avg_usd FROM analytics.fct_order_lines WHERE currency IN ('BTC', 'ETH') GROUP BY currency"
      - echo "=== Duplicate check ==="
      - docker exec clickhouse clickhouse-client --password {{.CLICKHOUSE_PASSWORD}} --query "SELECT count() FROM (SELECT order_id, sku, count() as c FROM analytics.fct_order_lines GROUP BY order_id, sku HAVING c > 1)"

  # ===========================================================================
  # Quality
  # ===========================================================================
  lint:
    desc: Run all linters
    cmds:
      - task: tf-lint
      - docker compose config --quiet
      - echo "All lints passed."

  query:
    desc: Run sample analytical queries
    cmds:
      - docker exec -i clickhouse clickhouse-client --password {{.CLICKHOUSE_PASSWORD}} < scripts/sample-queries.sql

  # ===========================================================================
  # Full setup (first time)
  # ===========================================================================
  setup:
    desc: First-time setup. Starts infra, seeds data, configures Airbyte, runs dbt.
    cmds:
      - task: up
      - task: init-clickhouse
      - task: tf-init
      - task: tf-apply
      - task: dbt-deps
      - task: dbt-build
      - echo "Pipeline ready. Open http://localhost:3000 for Dagster, http://localhost:8000 for Airbyte."
